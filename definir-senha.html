<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Definir senha — Slotify</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{--roxo:#6d28d9;--roxo2:#4c1d95;--erro:#dc2626;--ok:#16a34a}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
       font-family:system-ui,Segoe UI,Roboto,sans-serif;
       background:linear-gradient(160deg,var(--roxo),var(--roxo2));padding:24px}
  .card{background:#fff;border-radius:16px;padding:32px;width:100%;max-width:420px;
        box-shadow:0 20px 45px rgba(0,0,0,.25)}
  h1{font-size:20px;margin:0 0 4px;text-align:center}
  p.sub{margin:0 0 20px;text-align:center;color:#6b7280;font-size:14px}
  label{display:block;font-size:13px;font-weight:600;margin:12px 0 6px}
  input{width:100%;padding:12px;border:1px solid #d1d5db;border-radius:10px;font-size:15px}
  button{width:100%;margin-top:18px;padding:12px;border:0;border-radius:10px;background:var(--roxo);
         color:#fff;font-size:15px;font-weight:600;cursor:pointer}
  button:disabled{opacity:.6;cursor:not-allowed}
  .msg{margin-top:14px;font-size:14px;text-align:center}
  .msg.err{color:var(--erro)}
  .msg.ok{color:var(--ok)}
  .hidden{display:none}
  a.back{display:block;text-align:center;margin-top:16px;color:var(--roxo);font-size:14px}
</style>
</head>
<body>
<div class="card">
  <h1>Cadastro de nova senha</h1>
  <p class="sub" id="subtitulo">Validando seu convite…</p>

  <form id="form" class="hidden">
    <label for="senha">Nova senha</label>
    <input id="senha" type="password" minlength="8" required autocomplete="new-password" />
    <label for="senha2">Confirmar senha</label>
    <input id="senha2" type="password" minlength="8" required autocomplete="new-password" />
    <button id="btn" type="submit">Salvar senha</button>
  </form>

  <div id="msg" class="msg"></div>
  <a class="back" href="./index.html">Voltar para o login</a>
</div>

<script>
// ============================================================
// definir-senha.html — suporta TODOS os formatos de link do Supabase:
//   1) ?code=...                        (PKCE)            -> exchangeCodeForSession
//   2) ?token_hash=...&type=recovery    (link novo)        -> verifyOtp
//   3) ?token_hash=...&type=invite      (convite)          -> verifyOtp
//   4) #access_token=...&refresh_token= (implicit legado) -> setSession
//   5) ?error=...&error_description=... (link expirado)    -> mensagem clara
// IMPORTANTE: detectSessionInUrl = false, para NÃO consumir o token
// automaticamente antes de tratarmos os casos acima.
// ============================================================
const SUPABASE_URL = 'https://krmvgrfwoanzajlsvjvm.supabase.co';
const SUPABASE_ANON_KEY = 'COLE_AQUI_SUA_ANON_KEY';

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
  auth: { detectSessionInUrl: false, persistSession: true, autoRefreshToken: true, flowType: 'implicit' }
});

const $form = document.getElementById('form');
const $msg  = document.getElementById('msg');
const $sub  = document.getElementById('subtitulo');
const $btn  = document.getElementById('btn');

function erro(texto) {
  $sub.textContent = 'Não foi possível validar o link';
  $msg.className = 'msg err';
  $msg.textContent = texto;
  $form.classList.add('hidden');
}
function ok(texto) {
  $msg.className = 'msg ok';
  $msg.textContent = texto;
}

function lerParametros() {
  const q = new URLSearchParams(window.location.search);
  const h = new URLSearchParams((window.location.hash || '').replace(/^#/, ''));
  const get = (k) => q.get(k) || h.get(k);
  return {
    code: get('code'),
    token_hash: get('token_hash') || get('token'),
    type: get('type'),
    access_token: get('access_token'),
    refresh_token: get('refresh_token'),
    error: get('error') || get('error_code'),
    error_description: get('error_description'),
  };
}

async function validarLink() {
  const p = lerParametros();

  if (p.error) {
    erro(decodeURIComponent(p.error_description || p.error).replace(/\+/g, ' ') +
         '. Peça um novo link ao administrador.');
    return false;
  }

  // 4) tokens direto na hash
  if (p.access_token && p.refresh_token) {
    const { error } = await sb.auth.setSession({
      access_token: p.access_token, refresh_token: p.refresh_token
    });
    if (error) { erro(error.message); return false; }
    return true;
  }

  // 1) PKCE
  if (p.code) {
    const { error } = await sb.auth.exchangeCodeForSession(p.code);
    if (error) { erro('Link inválido ou já utilizado: ' + error.message); return false; }
    return true;
  }

  // 2/3) token_hash + type (recovery | invite | signup | magiclink | email)
  if (p.token_hash) {
    const tipo = ['recovery', 'invite', 'signup', 'magiclink', 'email'].includes(p.type)
      ? p.type : 'recovery';
    const { error } = await sb.auth.verifyOtp({ token_hash: p.token_hash, type: tipo });
    if (error) { erro('Link inválido ou expirado: ' + error.message); return false; }
    return true;
  }

  // Sem parâmetros: talvez já exista sessão válida
  const { data } = await sb.auth.getSession();
  if (data?.session) return true;

  erro('Link inválido ou expirado. Solicite um novo convite ao administrador.');
  return false;
}

(async () => {
  const valido = await validarLink();
  if (!valido) return;

  // Limpa a URL para o token não ser reprocessado em um refresh
  window.history.replaceState({}, document.title, window.location.pathname);

  $sub.textContent = 'Defina a senha de acesso da sua conta.';
  $form.classList.remove('hidden');
})();

$form.addEventListener('submit', async (e) => {
  e.preventDefault();
  const s1 = document.getElementById('senha').value;
  const s2 = document.getElementById('senha2').value;
  $msg.className = 'msg';
  $msg.textContent = '';

  if (s1.length < 8) { $msg.className = 'msg err'; $msg.textContent = 'A senha deve ter ao menos 8 caracteres.'; return; }
  if (s1 !== s2)     { $msg.className = 'msg err'; $msg.textContent = 'As senhas não conferem.'; return; }

  $btn.disabled = true;
  const { error } = await sb.auth.updateUser({ password: s1 });
  if (error) {
    $btn.disabled = false;
    $msg.className = 'msg err';
    $msg.textContent = 'Erro ao salvar a senha: ' + error.message;
    return;
  }
  ok('Senha definida com sucesso! Redirecionando para o login…');
  await sb.auth.signOut();
  setTimeout(() => { window.location.href = './index.html'; }, 1800);
});
</script>
</body>
</html>
